backend = "glx";
vsync = true;
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;
use-damage = true;
fade = false;
shadow = false;
blur = false;
corner-radius = 0;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'"
];
mark-wmwin-focused = true;
mark-ovredir-focused = true;

@include "extra.conf"
