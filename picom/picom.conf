backend = "glx";
vsync = true;
#glx-no-stencil = true;
#glx-no-rebind-pixmap = true;
use-damage = true;
fading = true;
fade-delta = 5;
fade-in-step = 0.03;
fade-out-step = 0.03;
shadow = true;
shadow-exclude = [
	"class_g = 'Dunst'"
]
blur = false;
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'Dunst'"
];
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = true;

animations = ({
	triggers = ["open", "show"];
	offset-x = "(1 - scale-x) / 2 * window-width";
	offset-y = "(1 - scale-y) / 2 * window-height";

	shadow-offset-x = "offset-x";
	shadow-offset-y = "offset-y";
	shadow-scale-x = "scale-x"
	shadow-scale-y = "scale-y"	
	shadow-opacity = "opacity";

	opacity = {
		curve = "cubic-bezier(0.23,1.0,0.32,1)";
		duration = 0.470;
		start = 0;
		end = 1;
	};
	
	scale-x = {
		curve = "cubic-bezier(0.23,1.0,0.32,1)";
		duration = 0.470;
		start = 0.5;
		end = 1;
	};
	scale-y = "scale-x";
 }, {
	triggers = ["close", "hide"];
	offset-x = "(1 - scale-x) / 2 * window-width";
	offset-y = "(1 - scale-y) / 2 * window-height";

	shadow-offset-x = "offset-x";
	shadow-offset-y = "offset-y";
	shadow-scale-x = "scale-x"
	shadow-scale-y = "scale-y"	
	shadow-opacity = "opacity";

	opacity = {
		curve = "cubic-bezier(0.23,1.0,0.32,1)";
		duration = 0.470;
		start = 1;
		end = 0;
	};

	scale-x = {
		curve = "cubic-bezier(0.23,1.0,0.32,1)";
		duration = 0.470;
		start = 1;
		end = 0.5;
	};
	scale-y = "scale-x";
 }, {
 	triggers = ["geometry"];

	shadow-offset-x = "offset-x";
	shadow-offset-y = "offset-y";
	shadow-scale-x = "scale-x";
	shadow-scale-y = "scale-y";

 	scale-x = {
 		curve = "cubic-bezier(0.23,1.0,0.32,1)";
 		duration = 0.470;
 		start = "window-width-before / window-width";
 		end = 1;
 	}

 	scale-y = {
 		curve = "cubic-bezier(0.23,1.0,0.32,1)";
 		duration = 0.470;
 		start = "window-height-before / window-height";
 		end = 1;
 	}

 	offset-x = {
		curve = "cubic-bezier(0.23,1.0,0.32,1)";
		duration = 0.470;
		start = "window-x-before - window-x";
		end = 0;
 	}

 	offset-y = {
		curve = "cubic-bezier(0.23,1.0,0.32,1)";
		duration = 0.470;
		start = "window-y-before - window-y";
		end = 0;
 	}
 })

